owner: 0
host:
  enabled: true
  startSnowLuma: true
  qqExePath: ''
  scanIntervalSec: 5
accounts:
  - uin: 900000001
    persona: default
    snowlumaDir: 'E:\bot\SnowLuma-v1.14.22-win-x64-lite'
providers:
  deepseek: { baseUrl: 'https://api.deepseek.com', apiKeyEnv: DEEPSEEK_API_KEY }
  mimo: { baseUrl: '<待用户填写>', apiKeyEnv: MIMO_API_KEY }
slots:
  reply: [ { provider: deepseek, model: deepseek-v4-pro }, { provider: deepseek, model: deepseek-flash } ]
  judge: [ { provider: deepseek, model: deepseek-flash } ]
  extract: [ { provider: deepseek, model: deepseek-flash } ]
  vision: [ { provider: deepseek, model: deepseek-flash } ]
  oneoff: [ { provider: deepseek, model: deepseek-v4-pro, reasoning: high, maxTokens: 8000, timeoutSec: 240 }, { provider: deepseek, model: deepseek-flash } ]
pricing:
  deepseek-v4-pro: { input: 4.8, cachedInput: 0.16, output: 14.4 }
  deepseek-flash: { input: 1.1, cachedInput: 0.02, output: 4.3 }
budget: { dailyCny: 5, warnRatio: 0.8, oneoffTaskCny: 3 }
mood: { enabled: true, baseline: { valence: 0.1, arousal: 0.4 }, surfaceHalfLifeMin: 40, arousalHalfLifeMin: 40, reserve: { initial: 0.8 } }
affinity:
  enabled: true
  start: 15
  tiers: { positive: [15, 35, 60, 85], negative: [-85, -60, -35, -15] }
  curveDefaults:
    posGain: { preset: default, points: [] }
    posLoss: { preset: default, points: [] }
    negGain: { preset: default, points: [] }
    negLoss: { preset: default, points: [] }
sleep: { enabled: false, bedtime: '02:00', wake: '09:00', wakeWords: ['起床', '醒醒', '别睡了'], goodnight: true }
memory: { organizeAt: '04:00', rawRetentionDays: 7 }
selfEdit: { enabled: true, scopes: [persona_behavior, persona_traits, persona_boundaries, behavior, session] }
profile:
  schedule: { minimumMessages: 50, nightOwlRatio: 0.4, weekendActiveRatio: 1.5, morningRatio: 0.03, morningMinimumMessages: 100 }
defaults:
  enabled: false
  mode: mention_only
  modeSchedule: []
  proactiveCooldownSec: 120
  talkOffset: 0
  nicknames: []
  contextMessages: 20
  rate: { perUserPerMinute: 4, perSessionPerMinute: 8, minIntervalSec: 3 }
  groupNote: ''
sessions: {}
debug: { enabled: false, sessions: {}, retainDays: 7 } # 默认关闭；会话键可覆盖总开关
send: { dedupeWindowMs: 8000 } # 同会话内相同文本的发送去重窗口；0 表示关闭
stickers: { enabled: false, maxRatio: 0.3, onlyStickerRatio: 0.1, cooldownSec: 300, candidates: 8 }
privacy: { enabled: true, promoteMentions: 3, avoidMinutes: 10 }
interactions:
  master_ids: []
  react: { enabled: false, prob_scale: 1, per_hour_max: 12, per_sender_gap_s: 60 }
  poke: { enabled: false, poke_back: true, proactive: false, per_hour_max: 6, per_user_gap_s: 600 }
  recall: { enabled: false, self_auto: true, others: false }
  admin: { enabled: false, mute_max_s: 600, dry_run: true }
panel: { host: 127.0.0.1, port: 5180, passwordEnv: AQUARIUM_PANEL_PASSWORD }
